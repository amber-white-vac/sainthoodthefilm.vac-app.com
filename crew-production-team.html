<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sainthood crew and production team coming soon." />
    <title>Sainthood | Crew &amp; Production Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700&family=Oswald:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sainthood-red: #c90010;
        --red-deep: #94000b;
        --paper: #fff8ef;
        --ink: #140205;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.13), transparent 24rem),
          linear-gradient(180deg, #d00012 0%, var(--sainthood-red) 46%, var(--red-deep) 100%);
        color: var(--paper);
      }

      h1 {
        margin: 0;
        padding: 1rem;
        font-family: "Bebas Neue", Impact, sans-serif;
        font-size: clamp(3rem, 12vw, 9rem);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
        text-shadow:
          0 0.08em 0 var(--ink),
          0 0.18em 1.1em rgba(20, 2, 5, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming Soon</h1>
    </main>
  </body>
</html>
